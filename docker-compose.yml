version: '3.8'

services:
  bot:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mafia
      POSTGRES_PASSWORD: mafia_pass
      POSTGRES_DB: mafia_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mafia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
