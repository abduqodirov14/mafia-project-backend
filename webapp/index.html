<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>MAFIA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎭</text></svg>">
  <script>
    window.API_BASE = '';
  </script>
</head>
<body>
  <canvas id="fc"></canvas>

  <!-- SPLASH -->
  <div id="s0" class="scr on">
    <div class="sp-logo">
      <div class="sp-ring">
        <div class="sp-ring-inner"><div class="sp-eye"></div></div>
      </div>
      <div class="sp-ttl">MAFIA</div>
      <div class="sp-sub">O'YIN YUKLANMOQDA</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- HOME -->
  <div id="s1" class="scr">
    <div class="h-art">
      <div class="h-logo-3d">
        <div class="h-logo-ring"></div>
        <div class="h-logo-eye"></div>
      </div>
      <div class="h-ttl">MAFIA</div>
      <div class="h-tag">KIM KIMNI O'LDIRADI?</div>
    </div>
    <div class="h-panel">
      <button class="btn-c" id="btn-create">
        <span class="btn-icon">🎮</span> YANGI XONA YARATISH
      </button>
      <div class="or"><div class="or-l"></div><span class="or-t">YOKI</span><div class="or-l"></div></div>
      <div class="jrow">
        <input class="jinp" id="rid" placeholder="Xona ID kiriting..." maxlength="10" autocomplete="off" spellcheck="false" />
        <button class="btn-j" id="btn-join-input">KIRISH</button>
      </div>
      <div class="or"><div class="or-l"></div><span class="or-t">DEMO</span><div class="or-l"></div></div>
      <button class="btn-c btn-demo" id="btn-demo">
        <span class="btn-icon">🤖</span> BOTLAR BILAN O'YNA
      </button>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="s2" class="scr">
    <div class="lb-hd">
      <div class="lb-chip"><span class="lb-dot"></span><span class="lb-chip-t">KUTISH XONASI</span></div>
      <div class="lb-ttl">MAFIA GAME</div>
      <div class="id-card">
        <div>
          <div class="id-lbl">XONA ID</div>
          <div class="id-val" id="lb-id">------</div>
        </div>
        <div class="id-r">
          <div class="id-num" id="lb-cnt">0<span class="id-max">/15</span></div>
          <div class="id-sub">O'YINCHI</div>
        </div>
      </div>
      <div class="inv">
        <div class="inv-l" id="lb-inv">...</div>
        <button class="btn-cp" id="btn-copy-inv">NUSXA</button>
      </div>
    </div>
    <div class="lb-tbl-wrap">
      <div class="lb-tbl">
        <div class="lb-surf"></div>
        <div class="lb-ring"></div>
        <div id="lb-toks"><div class="lb-empty" id="lb-em">O'yinchilar kuting...</div></div>
      </div>
    </div>
    <div class="lb-body">
      <div class="sec-l">O'YINCHILAR</div>
      <div class="pl-list" id="pl-list"></div>
    </div>
    <div class="lb-ft">
      <div class="min-info" id="min-info"></div>
      <button class="btn-st" id="start-btn" disabled>▶ O'YINNI BOSHLASH</button>
      <div class="wait-t" id="wait-t">Xona egasi boshlashini kuting...</div>
    </div>
  </div>

  <!-- ROLE REVEAL -->
  <div id="s3" class="scr">
    <div class="rl-card">
      <div class="rl-glow"></div>
      <span class="rl-em" id="r-em">🎭</span>
      <div class="rl-nm" id="r-nm">YUKLANMOQDA</div>
      <div class="rl-ds" id="r-ds">...</div>
      <button class="btn-cont" id="btn-role-cont">DAVOM ETISH →</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="s4" class="scr">
    <div class="g-hud">
      <div class="ph-pill">
        <span class="ph-ic" id="ph-ic">⏳</span>
        <span class="ph-nm" id="ph-nm">KUTISH</span>
      </div>
      <div class="hud-rn" id="g-rn">TUR 1</div>
      <div class="hud-tm" id="g-tm">--</div>
    </div>
    <div class="tbl-sc">
      <div class="tbl-wr">
        <div class="tbl-sf"></div>
        <div class="tbl-ri"></div>
        <div id="toks"></div>
        <div class="tbl-sh"></div>
      </div>
    </div>
    <div class="g-body" id="g-body">
      <div class="inf-card"><div class="inf-msg" id="g-msg">O'yin davom etmoqda...</div></div>
      <div class="act-sec" id="act-sec">
        <div class="act-lbl" id="act-lbl">HARAKATNI TANLANG</div>
        <div class="act-grid" id="act-grid"></div>
      </div>
    </div>
    <div class="g-bar">
      <button class="bar-btn" id="btn-ch"><span class="bar-bi">💬</span><span>Chat</span></button>
      <button class="mic-btn" id="mic-btn"><span style="font-size:22px">🎤</span><span id="mic-l">Ovoz</span></button>
      <button class="bar-btn" id="btn-pp"><span class="bar-bi">👥</span><span>O'yinchilar</span></button>
    </div>
  </div>

  <!-- END -->
  <div id="s5" class="scr">
    <div class="end-c">
      <div class="end-trophy" id="e-trophy-wrap">
        <span class="end-em" id="e-em">🏆</span>
      </div>
      <div class="end-tt" id="e-tt">O'YIN TUGADI</div>
      <div class="end-sb" id="e-sb"></div>
      <button class="btn-ng" id="btn-new-game">YANGI O'YIN</button>
    </div>
  </div>

  <!-- CHAT PANEL -->
  <div class="bdp" id="ch-bd"></div>
  <div class="spn" id="ch-pn">
    <div class="sp-pill" id="ch-close"></div>
    <div class="sp-hd">💬 CHAT</div>
    <div class="chat-msgs" id="chat-msgs"></div>
    <div class="cf">
      <input class="ci" id="ci" placeholder="Xabar yozing..." maxlength="200" />
      <button class="csnd" id="btn-send-chat">➤</button>
    </div>
  </div>

  <!-- PLAYERS PANEL -->
  <div class="bdp" id="pp-bd"></div>
  <div class="spn" id="pp-pn">
    <div class="sp-pill" id="pp-close"></div>
    <div class="sp-hd">👥 O'YINCHILAR</div>
    <div class="pp-list" id="pp-list"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
