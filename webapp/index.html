<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MAFIA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--g:#c8a55e;--g2:#e8c87a;--g3:#8a6030;--r:#8b1515;--r2:#cc2222;--gr:#27ae60;--bg:#060404;--c1:rgba(255,255,255,.04);--c2:rgba(255,255,255,.07);--tx:#e8dfd0;--tx2:#9a8870;--tx3:#5a4838;--bd:rgba(200,165,94,.18);--bd2:rgba(200,165,94,.4);--rr:14px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:'EB Garamond',Georgia,serif}
body{display:flex;flex-direction:column;position:fixed;inset:0}
#fc{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;z-index:10;transition:opacity .4s,transform .4s cubic-bezier(.25,.46,.45,.94);transform:translateY(10px);overflow-y:auto;overflow-x:hidden}
.scr.on{opacity:1;pointer-events:all;transform:translateY(0)}
/* SPLASH */
#s0{background:var(--bg);z-index:100}
.sp-ring{width:72px;height:72px;border-radius:50%;border:1.5px solid var(--g);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;animation:sp 9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sp-eye{width:15px;height:15px;border-radius:50%;background:var(--g);box-shadow:0 0 14px var(--g)}
.sp-ttl{font-family:'Cinzel',serif;font-size:52px;font-weight:900;color:var(--g);letter-spacing:14px;text-align:center;animation:gl 3s ease-in-out infinite}
@keyframes gl{0%,100%{text-shadow:0 0 30px rgba(200,165,94,.3)}50%{text-shadow:0 0 80px rgba(200,165,94,.7),0 0 120px rgba(139,21,21,.3)}}
.sp-sub{font-size:11px;letter-spacing:6px;color:var(--tx3);margin-top:6px;text-align:center;font-family:'Cinzel',serif}
.dots{display:flex;gap:10px;justify-content:center;margin-top:42px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--g);animation:dt 1.5s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dt{0%,80%,100%{opacity:.15;transform:scale(.6)}40%{opacity:1;transform:scale(1)}}
/* HOME */
#s1{justify-content:flex-end;padding:0}
.h-art{position:absolute;top:0;left:0;right:0;bottom:220px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.h-ttl{font-family:'Cinzel',serif;font-size:64px;font-weight:900;color:var(--g);letter-spacing:17px;text-align:center;text-shadow:0 0 80px rgba(200,165,94,.4);animation:gl 3s ease-in-out infinite;line-height:1}
.h-tag{font-size:11px;letter-spacing:6px;color:var(--tx3);margin-top:10px;font-family:'Cinzel',serif;text-align:center}
.h-panel{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(14,10,8,.97),rgba(6,4,4,1));border-top:1px solid var(--bd);border-radius:28px 28px 0 0;padding:26px 20px max(22px,env(safe-area-inset-bottom));z-index:5}
.btn-c{width:100%;padding:17px;border:none;border-radius:var(--rr);background:linear-gradient(135deg,#c8a55e,#8a6030 60%,#5a3a10);color:#080402;font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 24px rgba(200,165,94,.25);transition:all .2s}
.btn-c:active{transform:scale(.97)}
.or{display:flex;align-items:center;gap:14px;margin:15px 0}
.or-l{flex:1;height:1px;background:var(--bd)}
.or-t{font-size:11px;color:var(--tx3);letter-spacing:2px;font-family:'Cinzel',serif}
.jrow{display:flex;gap:10px}
.jinp{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:var(--rr);padding:14px 16px;color:var(--tx);font-family:'EB Garamond',serif;font-size:17px;outline:none;letter-spacing:3px;transition:border .2s}
.jinp::placeholder{color:var(--tx3);letter-spacing:1px;font-size:14px}
.jinp:focus{border-color:var(--bd2)}
.btn-j{padding:14px 18px;border:1px solid var(--bd);border-radius:var(--rr);background:rgba(200,165,94,.08);color:var(--g);font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-j:active{background:rgba(200,165,94,.18);transform:scale(.97)}
/* LOBBY */
#s2{justify-content:flex-start;padding:0;align-items:stretch}
.lb-hd{padding:max(18px,env(safe-area-inset-top)) 18px 14px;background:linear-gradient(180deg,rgba(6,4,4,1),rgba(6,4,4,0));display:flex;flex-direction:column;align-items:center}
.lb-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(200,165,94,.07);border:1px solid var(--bd);border-radius:100px;padding:5px 16px;margin-bottom:12px}
.lb-dot{width:7px;height:7px;border-radius:50%;background:var(--gr);animation:bk 1.8s infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:.2}}
.lb-chip-t{font-size:11px;color:var(--tx2);letter-spacing:2px;font-family:'Cinzel',serif}
.lb-ttl{font-family:'Cinzel',serif;font-size:22px;font-weight:700;color:var(--g);letter-spacing:4px}
.id-card{width:100%;background:var(--c1);border:1px solid var(--bd);border-radius:var(--rr);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:13px}
.id-lbl{font-size:10px;color:var(--tx3);letter-spacing:3px;font-family:'Cinzel',serif;margin-bottom:3px}
.id-val{font-family:'Cinzel',serif;font-size:28px;color:var(--g2);letter-spacing:8px;font-weight:700;cursor:pointer}
.id-val:active{opacity:.6}
.id-r{text-align:right}
.id-num{font-family:'Cinzel',serif;font-size:30px;font-weight:900;color:var(--g)}
.id-sub{font-size:10px;color:var(--tx3);letter-spacing:2px}
.inv{width:100%;background:rgba(200,165,94,.04);border:1px solid var(--bd);border-radius:var(--rr);padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:10px}
.inv-l{flex:1;font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-cp{background:rgba(200,165,94,.1);border:1px solid var(--bd);color:var(--g);border-radius:8px;padding:5px 12px;font-size:11px;font-family:'Cinzel',serif;cursor:pointer;white-space:nowrap;letter-spacing:1px}
.btn-cp:active{background:rgba(200,165,94,.22)}
/* Stol */
.lb-tbl-wrap{flex:0 0 auto;width:100%;height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lb-tbl{position:relative;width:204px;height:204px}
.lb-surf{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 38% 35%,#3a2510,#180e06 65%,#0a0602);border:2px solid rgba(200,165,94,.22);box-shadow:0 0 40px rgba(0,0,0,.8),inset 0 0 25px rgba(0,0,0,.5)}
.lb-ring{position:absolute;inset:20px;border-radius:50%;border:1px solid rgba(200,165,94,.07)}
#lb-toks{position:absolute;inset:0}
.lb-tok{position:absolute;text-align:center;transform:translate(-50%,-50%);opacity:0;animation:tkIn .5s cubic-bezier(.175,.885,.32,1.275) forwards}
@keyframes tkIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(-90deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
.lb-pawn{width:22px;height:22px;margin:0 auto 3px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.lb-pawn.you{background:linear-gradient(155deg,#2e7a44,#1a4828);box-shadow:0 0 10px rgba(39,174,96,.35)}
.lb-pawn.oth{background:linear-gradient(155deg,#d4cfbf,#8a8574)}
.lb-pn{font-size:8px;color:var(--tx);white-space:nowrap;max-width:42px;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,1)}
.lb-pn.you{color:var(--g2);font-weight:600}
.lb-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);text-align:center;padding:20px;font-style:italic}
.lb-body{overflow-y:auto;padding:0 18px 10px;max-height:150px}
.sec-l{font-size:10px;letter-spacing:3px;color:var(--tx3);font-family:'Cinzel',serif;margin:12px 0 8px}
.pl-list{display:flex;flex-direction:column;gap:7px}
.pl-item{display:flex;align-items:center;gap:10px;background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;animation:sli .3s ease}
@keyframes sli{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.pl-av{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--g),var(--g3));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#080402;font-family:'Cinzel',serif}
.pl-av.you{background:linear-gradient(135deg,#27ae60,#1a6a3a)}
.pl-nm{flex:1;font-size:15px}
.pl-bg{font-size:9px;font-family:'Cinzel',serif;letter-spacing:1px;padding:2px 7px;border-radius:4px}
.pl-bg.ow{background:rgba(200,165,94,.1);color:var(--g);border:1px solid rgba(200,165,94,.2)}
.pl-bg.yu{background:rgba(39,174,96,.1);color:#3dba6a;border:1px solid rgba(39,174,96,.2)}
.lb-ft{padding:10px 18px max(18px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(6,4,4,1) 60%,rgba(6,4,4,0))}
.min-info{font-size:12px;color:var(--tx3);text-align:center;padding:4px 0 10px;font-style:italic}
.btn-st{width:100%;padding:16px;border:none;border-radius:var(--rr);background:linear-gradient(135deg,#c8a55e,#8a6030);color:#080402;font-family:'Cinzel',serif;font-size:14px;font-weight:700;letter-spacing:3px;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(200,165,94,.2)}
.btn-st:disabled{opacity:.3;pointer-events:none}
.btn-st:active{transform:scale(.97)}
.wait-t{font-size:13px;color:var(--tx3);text-align:center;padding:14px 0;font-style:italic}
/* ROLE */
#s3{background:radial-gradient(ellipse at center,#160808,#060404 65%)}
.rl-card{background:var(--c1);border:1px solid var(--bd);border-radius:24px;padding:36px 26px;text-align:center;max-width:310px;width:100%}
.rl-em{font-size:74px;display:block;margin-bottom:22px;animation:ri .6s cubic-bezier(.175,.885,.32,1.275)}
@keyframes ri{from{transform:scale(0) rotate(-160deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.rl-nm{font-family:'Cinzel',serif;font-size:30px;font-weight:900;color:var(--g);letter-spacing:5px;margin-bottom:13px}
.rl-ds{font-size:16px;color:var(--tx2);line-height:1.7;margin-bottom:26px;font-style:italic}
.btn-cont{width:100%;padding:15px;border:1px solid var(--bd);border-radius:var(--rr);background:rgba(200,165,94,.07);color:var(--g);font-family:'Cinzel',serif;font-size:14px;letter-spacing:3px;cursor:pointer}
/* GAME */
#s4{justify-content:flex-start;padding:0;overflow:hidden}
.g-hud{width:100%;display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 15px 11px;background:rgba(6,4,4,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);flex-shrink:0;z-index:10}
.ph-pill{display:flex;align-items:center;gap:7px;background:var(--c1);border:1px solid var(--bd);border-radius:100px;padding:6px 13px}
.ph-ic{font-size:14px}.ph-nm{font-family:'Cinzel',serif;font-size:11px;color:var(--g);font-weight:600;letter-spacing:1px}
.hud-rn{font-size:10px;color:var(--tx3);letter-spacing:2px;font-family:'Cinzel',serif}
.hud-tm{font-family:'Cinzel',serif;font-size:26px;font-weight:900;color:var(--tx);min-width:56px;text-align:center}
.hud-tm.urg{color:var(--r2);animation:ub .5s infinite}
@keyframes ub{0%,100%{opacity:1}50%{opacity:.3}}
.tbl-sc{flex:0 0 auto;width:100%;height:255px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tbl-wr{position:relative;width:244px;height:244px}
.tbl-sf{position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at 38% 32%,#3a2510,#180e06 60%,#0a0602);border:2px solid rgba(200,165,94,.28);box-shadow:0 0 50px rgba(0,0,0,.8),inset 0 0 30px rgba(0,0,0,.5)}
.tbl-ri{position:absolute;inset:22px;border-radius:50%;border:1px solid rgba(200,165,94,.07)}
.tbl-sh{position:absolute;bottom:-14px;left:12%;width:76%;height:16px;border-radius:50%;background:#000;filter:blur(8px);opacity:.6}
#toks{position:absolute;inset:0}
.tok{position:absolute;text-align:center;transform:translate(-50%,-50%);cursor:pointer;transition:all .3s}
.tok-b{width:29px;height:29px;margin:0 auto 3px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transition:all .25s}
.tok.alive .tok-b{background:linear-gradient(155deg,#d4cfbf,#8a8574)}
.tok.you .tok-b{background:linear-gradient(155deg,#2e7a44,#1a4828);box-shadow:0 0 10px rgba(39,174,96,.3)}
.tok.dead .tok-b{background:linear-gradient(155deg,#3a3530,#1a1510);opacity:.4}
.tok.ctr .tok-b{background:linear-gradient(155deg,#2a0c0c,#180606);box-shadow:0 0 12px rgba(139,26,26,.5)}
.tok-lb{font-size:8.5px;color:var(--tx);white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,1);max-width:44px;overflow:hidden;text-overflow:ellipsis}
.tok.you .tok-lb{color:var(--g2);font-weight:600}
.tok.dead .tok-lb{color:var(--tx3);text-decoration:line-through}
.g-body{flex:1;overflow-y:auto;padding:8px 13px 4px;display:flex;flex-direction:column;gap:7px}
.inf-card{background:var(--c1);border:1px solid var(--bd);border-radius:var(--rr);padding:11px 13px}
.inf-msg{font-size:14px;color:var(--tx2);line-height:1.6;font-style:italic}
.act-sec{display:none}
.act-lbl{font-size:10px;color:var(--tx3);letter-spacing:3px;font-family:'Cinzel',serif;margin-bottom:8px}
.act-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.act-btn{background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.act-btn.sel{background:rgba(200,165,94,.1);border-color:var(--bd2)}
.act-btn:active{transform:scale(.96)}
.act-ic{font-size:18px}.act-nm{font-size:11px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.g-bar{flex-shrink:0;display:flex;gap:8px;padding:8px 13px max(10px,env(safe-area-inset-bottom));background:rgba(6,4,4,.97);border-top:1px solid var(--bd)}
.bar-btn{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--c1);color:var(--tx);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s}
.bar-btn.on{background:rgba(200,165,94,.1);border-color:var(--bd2);color:var(--g)}
.bar-bi{font-size:20px}
.mic-btn{flex:1.4;border-radius:10px;border:1px solid var(--bd);background:var(--c1);color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;padding:8px;transition:all .2s}
.mic-btn.live{background:rgba(39,174,96,.12);border-color:rgba(39,174,96,.4);color:#3dba6a;animation:mp 1s infinite}
@keyframes mp{0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,.3)}50%{box-shadow:0 0 0 6px rgba(39,174,96,0)}}
/* END */
#s5{background:radial-gradient(ellipse at center,#0e0a04,#060404)}
.end-c{text-align:center;max-width:290px}
.end-em{font-size:70px;display:block;margin-bottom:14px;animation:ei .6s cubic-bezier(.175,.885,.32,1.275)}
@keyframes ei{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.end-tt{font-family:'Cinzel',serif;font-size:24px;font-weight:900;color:var(--g);letter-spacing:4px;margin-bottom:8px}
.end-sb{font-size:15px;color:var(--tx2);margin-bottom:28px;font-style:italic}
.btn-ng{width:100%;padding:15px;border:1px solid var(--bd);border-radius:var(--rr);background:rgba(200,165,94,.07);color:var(--g);font-family:'Cinzel',serif;font-size:14px;letter-spacing:3px;cursor:pointer}
/* PANELS */
.bdp{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.bdp.on{opacity:1;pointer-events:all}
.spn{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#0e0a08;border-top:1px solid var(--bd);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.46,.45,.94);max-height:70vh;display:flex;flex-direction:column}
.spn.on{transform:translateY(0)}
.sp-pill{width:38px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:12px auto 8px;cursor:pointer;flex-shrink:0}
.sp-hd{font-family:'Cinzel',serif;font-size:13px;color:var(--g);letter-spacing:2px;text-align:center;padding-bottom:10px;border-bottom:1px solid var(--bd);flex-shrink:0}
.chat-msgs{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.cmsg{display:flex;flex-direction:column;gap:2px}
.cm{display:flex;gap:8px;align-items:baseline}
.cw{font-size:11px;color:var(--g);font-weight:600;font-family:'Cinzel',serif}
.ct{font-size:10px;color:var(--tx3)}
.ctxt{font-size:14px;color:var(--tx);line-height:1.5}
.cmsg.sys .ctxt{color:var(--tx3);font-style:italic;font-size:12px}
.cf{display:flex;gap:8px;padding:10px 16px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--bd);flex-shrink:0}
.ci{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--bd);border-radius:20px;padding:10px 16px;color:var(--tx);font-family:'EB Garamond',serif;font-size:15px;outline:none}
.ci:focus{border-color:var(--bd2)}
.csnd{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g3));border:none;color:#080402;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pp-list{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:7px}
.pp-row{display:flex;align-items:center;gap:10px;background:var(--c1);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
.pp-row.dead{opacity:.45}
.pp-av{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--g),var(--g3));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#080402;font-family:'Cinzel',serif}
.pp-row.dead .pp-av{background:#2a2520;color:var(--tx3)}
.pp-nm{flex:1;font-size:14px}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);background:rgba(14,10,8,.97);border:1px solid var(--bd);border-radius:100px;padding:10px 22px;font-size:13px;color:var(--tx);z-index:200;transition:transform .3s;white-space:nowrap;backdrop-filter:blur(14px)}
.toast.on{transform:translateX(-50%) translateY(0)}
.cvc{position:fixed;inset:0;pointer-events:none;z-index:300}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
</style>
</head>
<body>
<canvas id="fc"></canvas>
<div id="s0" class="scr on"><div class="sp-ring"><div style="width:52px;height:52px;border-radius:50%;border:1px solid var(--g3);display:flex;align-items:center;justify-content:center"><div class="sp-eye"></div></div></div><div class="sp-ttl">MAFIA</div><div class="sp-sub">O'YIN YUKLANMOQDA</div><div class="dots"><span></span><span></span><span></span></div></div>
<div id="s1" class="scr"><div class="h-art"><div class="h-ttl">MAFIA</div><div class="h-tag">KIM KIMNI O'LDIRADI?</div></div><div class="h-panel"><button class="btn-c" onclick="doCreate()">✦ &nbsp; YANGI XONA YARATISH</button><div class="or"><div class="or-l"></div><span class="or-t">YOKI</span><div class="or-l"></div></div><div class="jrow"><input class="jinp" id="rid" placeholder="Xona ID kiriting..." maxlength="10" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')doJoin()"><button class="btn-j" onclick="doJoin()">KIRISH</button></div></div></div>
<div id="s2" class="scr"><div class="lb-hd"><div class="lb-chip"><span class="lb-dot"></span><span class="lb-chip-t">KUTISH XONASI</span></div><div class="lb-ttl">MAFIA GAME</div><div class="id-card"><div><div class="id-lbl">XONA ID</div><div class="id-val" id="lb-id" onclick="copyID()">------</div></div><div class="id-r"><div class="id-num" id="lb-cnt">0<span style="font-size:15px;color:var(--tx3)">/15</span></div><div class="id-sub">O'YINCHI</div></div></div><div class="inv"><div class="inv-l" id="lb-inv">...</div><button class="btn-cp" onclick="copyInv()">NUSXA</button></div></div><div class="lb-tbl-wrap"><div class="lb-tbl"><div class="lb-surf"></div><div class="lb-ring"></div><div id="lb-toks"><div class="lb-empty" id="lb-em">O'yinchilar kuting...</div></div></div></div><div class="lb-body"><div class="sec-l">O'YINCHILAR</div><div class="pl-list" id="pl-list"></div></div><div class="lb-ft"><div class="min-info" id="min-info"></div><button class="btn-st" id="start-btn" onclick="doStart()" disabled>▶ &nbsp; O'YINNI BOSHLASH</button><div class="wait-t" id="wait-t">Xona egasi boshlashini kuting...</div></div></div>
<div id="s3" class="scr"><div class="rl-card"><span class="rl-em" id="r-em">🎭</span><div class="rl-nm" id="r-nm">YUKLANMOQDA</div><div class="rl-ds" id="r-ds">...</div><button class="btn-cont" onclick="go('s4')">DAVOM ETISH →</button></div></div>
<div id="s4" class="scr"><div class="g-hud"><div class="ph-pill"><span class="ph-ic" id="ph-ic">⏳</span><span class="ph-nm" id="ph-nm">KUTISH</span></div><div class="hud-rn" id="g-rn">TUR 1</div><div class="hud-tm" id="g-tm">--</div></div><div class="tbl-sc"><div class="tbl-wr"><div class="tbl-sf"></div><div class="tbl-ri"></div><div id="toks"></div><div class="tbl-sh"></div></div></div><div class="g-body" id="g-body"><div class="inf-card"><div class="inf-msg" id="g-msg">O'yin davom etmoqda...</div></div><div class="act-sec" id="act-sec"><div class="act-lbl" id="act-lbl">HARAKATNI TANLANG</div><div class="act-grid" id="act-grid"></div></div></div><div class="g-bar"><button class="bar-btn" id="btn-ch" onclick="openChat()"><span class="bar-bi">💬</span><span>Chat</span></button><button class="mic-btn" id="mic-btn" onclick="toggleMic()"><span style="font-size:22px">🎤</span><span id="mic-l">Ovoz</span></button><button class="bar-btn" id="btn-pp" onclick="openPP()"><span class="bar-bi">👥</span><span>O'yinchilar</span></button></div></div>
<div id="s5" class="scr"><div class="end-c"><span class="end-em" id="e-em">🏆</span><div class="end-tt" id="e-tt">O'YIN TUGADI</div><div class="end-sb" id="e-sb"></div><button class="btn-ng" onclick="location.href=location.pathname">YANGI O'YIN</button></div></div>
<div class="bdp" id="ch-bd" onclick="closeChat()"></div><div class="spn" id="ch-pn"><div class="sp-pill" onclick="closeChat()"></div><div class="sp-hd">💬 &nbsp; CHAT</div><div class="chat-msgs" id="chat-msgs"></div><div class="cf"><input class="ci" id="ci" placeholder="Xabar yozing..." maxlength="200" onkeydown="if(event.key==='Enter')sendChat()"><button class="csnd" onclick="sendChat()">➤</button></div></div>
<div class="bdp" id="pp-bd" onclick="closePP()"></div><div class="spn" id="pp-pn"><div class="sp-pill" onclick="closePP()"></div><div class="sp-hd">👥 &nbsp; O'YINCHILAR</div><div class="pp-list" id="pp-list"></div></div>
<div class="toast" id="toast"></div>
<script>
(()=>{const c=document.getElementById('fc'),ctx=c.getContext('2d');let W,H,ps=[];const r=()=>{W=c.width=innerWidth;H=c.height=innerHeight};r();window.addEventListener('resize',r);const mk=()=>({x:Math.random()*W,y:H+8,vx:(Math.random()-.5)*.7,vy:-(Math.random()*1.2+.5),life:1,decay:Math.random()*.004+.003,rr:Math.random()*2.5+1,h:Math.random()*30+5});(function fr(){ctx.clearRect(0,0,W,H);for(let i=0;i<3;i++)if(ps.length<100)ps.push(mk());ps=ps.filter(p=>p.life>0);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;p.vx+=(Math.random()-.5)*.05;ctx.globalAlpha=p.life*.4;ctx.fillStyle=`hsl(${p.h},90%,${50+p.life*20}%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.rr,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;requestAnimationFrame(fr)})();})();
const TgApp=window.Telegram?.WebApp;
if(TgApp){TgApp.ready();TgApp.expand()}
const S={roomID:'',userID:0,username:'',isOwner:false,phase:'waiting',round:0,players:[],myRole:'',myRoleEmoji:'',timer:0,timerT:null,ws:null,voiceOn:false,localStream:null,peers:{},selAct:null,_inv:''};
const _BASE=(window.API_BASE||'').replace(/\/$/,'');
const _WS_BASE=_BASE?_BASE.replace('https://','wss://').replace('http://','ws://'):'';
function getUser(){if(TgApp?.initDataUnsafe?.user){const u=TgApp.initDataUnsafe.user;return{id:u.id,name:u.username||u.first_name||'O\'yinchi'}}let id=localStorage.getItem('muid'),nm=localStorage.getItem('mnm');if(!id){id=String(Math.floor(Math.random()*9e5+1e5));localStorage.setItem('muid',id)}if(!nm){nm='Mehmon'+id.slice(-3);localStorage.setItem('mnm',nm)}return{id:parseInt(id),name:nm}}
async function api(url,opts={}){const h={'ngrok-skip-browser-warning':'true'};if(opts.body)h['Content-Type']='application/json';try{const r=await fetch(_BASE+url,{...opts,headers:h});const t=await r.text();if(t.trim().startsWith('<'))throw new Error('Server xato');return JSON.parse(t)}catch(e){console.error('API:',e.message);throw e}}
function init(){const u=getUser();S.userID=u.id;S.username=u.name;const q=new URLSearchParams(location.search);S.roomID=q.get('room')||'';if(S.roomID)autoJoin();else setTimeout(()=>go('s1'),1800)}
async function autoJoin(){try{const d=await api('/api/room/info?room='+S.roomID);if(d.ok){const j=await api('/api/room/join',{method:'POST',body:JSON.stringify({room_id:S.roomID,user_id:S.userID,name:S.username})});if(j.ok||j.error?.includes('allaqachon')){connectWS();go('s2')}else{toast('❌ '+j.error);setTimeout(()=>go('s1'),2000)}}else{toast('❌ Xona topilmadi');setTimeout(()=>go('s1'),2000)}}catch(e){toast('❌ '+e.message);setTimeout(()=>go('s1'),2500)}}
async function doCreate(){toast('⏳ Xona yaratilmoqda...');try{const d=await api('/api/room/create?user='+S.userID+'&name='+encodeURIComponent(S.username));if(!d.ok){toast('❌ '+(d.error||'Xato'));return}S.roomID=d.room_id;S.isOwner=true;S._inv=d.invite_link||location.origin+'/webapp/?room='+d.room_id;history.replaceState({},'',location.pathname+'?room='+S.roomID);connectWS();showLobby()}catch(e){toast('❌ '+e.message)}}
async function doJoin(){const rid=document.getElementById('rid').value.trim();if(!rid){toast('❌ Xona ID kiriting!');return}toast('⏳ Qo\'shilmoqda...');try{const d=await api('/api/room/join',{method:'POST',body:JSON.stringify({room_id:rid,user_id:S.userID,name:S.username})});if(!d.ok&&!d.error?.includes('allaqachon')){toast('❌ '+(d.error||'Xato'));return}S.roomID=rid;history.replaceState({},'',location.pathname+'?room='+rid);connectWS();showLobby()}catch(e){toast('❌ '+e.message)}}
function showLobby(){document.getElementById('lb-id').textContent=S.roomID;const inv=S._inv||location.origin+'/webapp/?room='+S.roomID;document.getElementById('lb-inv').textContent=inv;S._inv=inv;go('s2')}
function connectWS(){if(!S.roomID)return;const wu=_WS_BASE?`${_WS_BASE}/ws?room=${S.roomID}&user=${S.userID}`:`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?room=${S.roomID}&user=${S.userID}`;S.ws=new WebSocket(wu);S.ws.onopen=()=>addSys('✅ Ulandi');S.ws.onmessage=e=>{try{dispatch(JSON.parse(e.data))}catch(x){}};S.ws.onclose=()=>{addSys('⚠️ Uzildi...');setTimeout(connectWS,3000)}}
function wsSend(t,p){if(S.ws?.readyState===1)S.ws.send(JSON.stringify({type:t,room_id:S.roomID,user_id:S.userID,payload:JSON.stringify(p)}))}
function dispatch(msg){let p={};try{p=msg.payload?JSON.parse(msg.payload):{}}catch(x){}const M={room_info:onRI,role_reveal:onRole,game_state:onState,phase_change:onPhase,player_died:onDied,game_end:onEnd,chat:onChatMsg,voice_signal:onVoiceSig,error:d=>toast('❌ '+(d.message||'Xato')),sheriff_result:d=>addSys('🕵️ '+d.result)};if(M[msg.type])M[msg.type](p)}
function onRI(d){if(d.players)S.players=d.players;document.getElementById('lb-id').textContent=d.room_id||S.roomID;const cnt=d.count||S.players.length;document.getElementById('lb-cnt').innerHTML=`${cnt}<span style="font-size:15px;color:var(--tx3)">/${d.max||15}</span>`;if(d.owner_id)S.isOwner=S.userID===d.owner_id;if(d.invite_link)S._inv=d.invite_link;document.getElementById('lb-inv').textContent=S._inv||location.origin+'/webapp/?room='+(d.room_id||S.roomID);renderLobTable();renderLobList();const sb=document.getElementById('start-btn'),wt=document.getElementById('wait-t'),mi=document.getElementById('min-info');if(S.isOwner){sb.disabled=cnt<4;sb.style.display='block';wt.style.display='none';mi.textContent=cnt<4?`Kamida 4 o'yinchi kerak (${cnt}/4)`:''}else{sb.style.display='none';wt.style.display='block';mi.textContent=''}if(cur()==='s0')go('s2')}
function onRole(d){document.getElementById('r-em').textContent=d.emoji||'🎭';document.getElementById('r-nm').textContent=(d.role||'').toUpperCase();document.getElementById('r-ds').textContent=d.description||'';S.myRole=d.role||'';S.myRoleEmoji=d.emoji||'';go('s3')}
function onState(d){S.phase=d.phase;S.round=d.round;if(d.players)S.players=d.players;renderToks();renderPP();updateHUD();if(cur()==='s2'||cur()==='s3')go('s4')}
function onPhase(d){S.phase=d.phase;S.round=d.round;updateHUD();startTimer(d.timer||60);if(d.message)addSys(d.message);renderAct();if(cur()!=='s4')go('s4')}
function onDied(d){const p=S.players.find(x=>x.id===d.player_id);if(p){p.is_alive=false;p.role=d.role}renderToks();renderPP();const txt=d.voted_out?`⚖️ ${d.name} chiqarildi (${d.role})`:`💀 ${d.name} o'ldirildi`;addSys(txt);toast(txt)}
function onEnd(d){clearInterval(S.timerT);document.getElementById('e-em').textContent=d.winner==='town'?'🎉':d.winner==='mafia'?'😈':d.winner==='manyak'?'🔪':'🧌';document.getElementById('e-tt').textContent=d.title||'O\'YIN TUGADI';document.getElementById('e-sb').textContent='';go('s5');if(d.winner==='town')confetti()}
function onChatMsg(d){addMsg({name:d.username,text:sanitize(d.text),me:d.user_id===S.userID})}
function renderLobTable(){const c=document.getElementById('lb-toks'),em=document.getElementById('lb-em');if(!S.players.length){em.style.display='flex';return}em.style.display='none';Array.from(c.querySelectorAll('.lb-tok')).forEach(t=>t.remove());const n=S.players.length,cx=102,cy=102,r=76;S.players.forEach((p,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);const isYou=p.id===S.userID;const tok=document.createElement('div');tok.className='lb-tok';tok.style.left=x+'px';tok.style.top=y+'px';tok.style.animationDelay=(i*130)+'ms';tok.innerHTML=`<div class="lb-pawn ${isYou?'you':'oth'}"></div><div class="lb-pn ${isYou?'you':''}">${isYou?'⭐':''}${p.name}</div>`;c.appendChild(tok)})}
function renderLobList(){document.getElementById('pl-list').innerHTML=S.players.map(p=>`<div class="pl-item"><div class="pl-av ${p.id===S.userID?'you':''}">${(p.name||'?')[0].toUpperCase()}</div><div class="pl-nm">${sanitize(p.name)}</div>${p.join_order===1?'<div class="pl-bg ow">👑 EGA</div>':''}${p.id===S.userID?'<div class="pl-bg yu">SIZ</div>':''}</div>`).join('')}
function renderToks(){const c=document.getElementById('toks');c.innerHTML='';const n=S.players.length;if(!n)return;const cx=122,cy=122,r=92;S.players.forEach((p,i)=>{const a=(i/n)*2*Math.PI-Math.PI/2;const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);const isYou=p.id===S.userID,dead=!p.is_alive;const d=document.createElement('div');d.className=`tok ${dead?'dead':isYou?'you':'alive'}`;d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<div class="tok-b"></div><div class="tok-lb">${dead?'💀':''}${isYou?'⭐':''}${sanitize(p.name)}</div>`;c.appendChild(d)});const ctr=document.createElement('div');ctr.className='tok ctr';ctr.style.left=cx+'px';ctr.style.top=cy+'px';ctr.innerHTML='<div class="tok-b"></div>';c.appendChild(ctr)}
function renderPP(){document.getElementById('pp-list').innerHTML=S.players.map(p=>`<div class="pp-row ${!p.is_alive?'dead':''}"><div class="pp-av">${(p.name||'?')[0].toUpperCase()}</div><div class="pp-nm">${sanitize(p.name)}${p.id===S.userID?' (Siz)':''}</div><div>${p.is_alive?'🟢':'💀'}</div></div>`).join('')}
function updateHUD(){const ic={night:'🌙',day:'☀️',voting:'🗳️',waiting:'⏳'},nm={night:'TUN',day:'KUNDUZ',voting:'OVOZ BERISH',waiting:'KUTISH'};document.getElementById('ph-ic').textContent=ic[S.phase]||'⏳';document.getElementById('ph-nm').textContent=nm[S.phase]||'KUTISH';document.getElementById('g-rn').textContent='TUR '+S.round;renderAct()}
function startTimer(s){clearInterval(S.timerT);S.timer=s;const el=document.getElementById('g-tm');el.textContent=fmt(s);el.classList.remove('urg');S.timerT=setInterval(()=>{S.timer--;el.textContent=fmt(S.timer);if(S.timer<=10)el.classList.add('urg');if(S.timer<=0)clearInterval(S.timerT)},1000)}
const fmt=s=>s<=0?'0:00':`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function renderAct(){const sec=document.getElementById('act-sec'),grid=document.getElementById('act-grid'),lbl=document.getElementById('act-lbl');const isN=S.phase==='night',isV=S.phase==='voting';if((!isN&&!isV)||!S.myRole){sec.style.display='none';return}const alive=S.players.filter(p=>p.is_alive&&p.id!==S.userID);const nightRoles={'Mafia':'😈 KIMNI O\'LDIRASIZ?','Don':'😈 KIMNI O\'LDIRASIZ?','Shifokor':'👨‍⚕️ KIMNI DAVOLAYSIZ?','Komissar':'🕵️ KIMNI TEKSHIRASIZ?','Serjant':'👮 KIMNI KUZATASIZ?','Mashuqa':'💃 KIMNI BLOKLAYSIZ?','Daydi':'🧙 KIM UYIDA TUNAYSIZ?','Manyak':'🔪 KIMNI O\'LDIRASIZ?'};if(isN&&!nightRoles[S.myRole]){sec.style.display='none';return}lbl.textContent=isV?'🗳 KIMNI CHIQARAMIZ?':nightRoles[S.myRole];grid.innerHTML=alive.map(p=>`<div class="act-btn ${S.selAct===p.id?'sel':''}" onclick="doAct(${p.id},'${sanitize(p.name)}')" data-id="${p.id}"><span class="act-ic">${isV?'👈':'🎯'}</span><span class="act-nm">${sanitize(p.name)}</span></div>`).join('');sec.style.display='block'}
function doAct(tid,tname){S.selAct=tid;renderAct();if(S.phase==='voting'){wsSend('day_vote',{target_id:tid});toast('✅ '+tname+' ga ovoz berildi')}else{wsSend('night_action',{role:S.myRole,target_id:tid});toast('✅ '+tname+' tanlandi')}}
function doStart(){wsSend('start_game',{});toast('⏳ O\'yin boshlanmoqda...')}
function copyID(){navigator.clipboard?.writeText(S.roomID).then(()=>toast('✅ ID nusxa olindi!'));TgApp?.HapticFeedback?.impactOccurred('light')}
function copyInv(){navigator.clipboard?.writeText(S._inv).then(()=>toast('✅ Havola nusxa olindi!'));TgApp?.HapticFeedback?.impactOccurred('light')}
function openChat(){document.getElementById('ch-pn').classList.add('on');document.getElementById('ch-bd').classList.add('on');document.getElementById('btn-ch').classList.add('on');setTimeout(()=>{document.getElementById('ci').focus();scrollChat()},300)}
function closeChat(){document.getElementById('ch-pn').classList.remove('on');document.getElementById('ch-bd').classList.remove('on');document.getElementById('btn-ch').classList.remove('on')}
function openPP(){renderPP();document.getElementById('pp-pn').classList.add('on');document.getElementById('pp-bd').classList.add('on');document.getElementById('btn-pp').classList.add('on')}
function closePP(){document.getElementById('pp-pn').classList.remove('on');document.getElementById('pp-bd').classList.remove('on');document.getElementById('btn-pp').classList.remove('on')}
function sendChat(){const inp=document.getElementById('ci');const txt=inp.value.trim();if(!txt)return;wsSend('chat',{user_id:S.userID,username:S.username,text:txt});addMsg({name:S.username,text:sanitize(txt),me:true});inp.value=''}
function addMsg(d){const c=document.getElementById('chat-msgs'),div=document.createElement('div');div.className='cmsg';const t=new Date();const ts=`${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;div.innerHTML=`<div class="cm"><span class="cw" style="${d.me?'color:#3dba6a':''}">${sanitize(d.name)}</span><span class="ct">${ts}</span></div><div class="ctxt">${d.text}</div>`;c.appendChild(div);scrollChat()}
function addSys(txt){if(!txt)return;const c=document.getElementById('chat-msgs'),div=document.createElement('div');div.className='cmsg sys';div.innerHTML=`<div class="ctxt">${sanitize(txt)}</div>`;c.appendChild(div);scrollChat()}
function scrollChat(){const c=document.getElementById('chat-msgs');setTimeout(()=>c.scrollTop=c.scrollHeight,50)}
function sanitize(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function toggleMic(){S.voiceOn?stopMic():await startMic()}
async function startMic(){try{S.localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});S.voiceOn=true;document.getElementById('mic-btn').classList.add('live');document.getElementById('mic-l').textContent='Gapiryapsiz';toast('🎤 Yoqildi');S.players.forEach(p=>{if(p.id!==S.userID&&p.is_alive)mkPeer(p.id,true)})}catch(e){toast('❌ Mikrofon ruxsati yo\'q')}}
function stopMic(){S.localStream?.getTracks().forEach(t=>t.stop());S.localStream=null;Object.values(S.peers).forEach(pc=>pc.close());S.peers={};S.voiceOn=false;document.getElementById('mic-btn').classList.remove('live');document.getElementById('mic-l').textContent='Ovoz'}
function mkPeer(rid,init){if(S.peers[rid])return;const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});S.peers[rid]=pc;if(S.localStream)S.localStream.getTracks().forEach(t=>pc.addTrack(t,S.localStream));pc.ontrack=e=>{const a=document.createElement('audio');a.srcObject=e.streams[0];a.autoplay=true;document.body.appendChild(a)};pc.onicecandidate=e=>{if(e.candidate)wsSend('voice_signal',{type:'candidate',to:rid,from:S.userID,candidate:e.candidate})};if(init)pc.createOffer().then(o=>{pc.setLocalDescription(o);wsSend('voice_signal',{type:'offer',to:rid,from:S.userID,sdp:o})})}
async function onVoiceSig(d){if(!S.voiceOn||d.to!==S.userID)return;const fid=d.from;if(d.type==='offer'){const pc=mkPeer(fid,false)||S.peers[fid];await pc.setRemoteDescription(d.sdp);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);wsSend('voice_signal',{type:'answer',to:fid,from:S.userID,sdp:ans})}else if(d.type==='answer'){const pc=S.peers[fid];if(pc)await pc.setRemoteDescription(d.sdp)}else if(d.type==='candidate'){const pc=S.peers[fid];if(pc)await pc.addIceCandidate(d.candidate)}}
function confetti(){const cv=document.createElement('canvas');cv.className='cvc';cv.width=innerWidth;cv.height=innerHeight;document.body.appendChild(cv);const cx=cv.getContext('2d');const ps=Array.from({length:120},()=>({x:Math.random()*innerWidth,y:Math.random()*-300,r:Math.random()*5+3,c:['#c8a55e','#27ae60','#2980b9','#e74c3c','#f1c40f'][Math.floor(Math.random()*5)],vx:(Math.random()-.5)*2.5,vy:Math.random()*3.5+1.5}));let f=0;(function d(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fill();p.x+=p.vx;p.y+=p.vy});if(++f<200)requestAnimationFrame(d);else cv.remove()})()}
function go(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));document.getElementById(id)?.classList.add('on')}
function cur(){return document.querySelector('.scr.on')?.id}
let tT;function toast(m,d=2800){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),d)}
init();
</script>
</body>
